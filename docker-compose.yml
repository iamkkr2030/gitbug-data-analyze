name: gitbugs

x-airflow: &airflow
  build: .
  image: gitbugs-pipeline:local
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_FOLDER: /opt/gitbugs/dags
    AIRFLOW__CORE__PARALLELISM: '2'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    MYSQL_HOST: mysql
    MYSQL_DATABASE: gitbugs
    MYSQL_USER: gitbugs
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    GITBUGS_DATA_DIR: /opt/gitbugs/data
    GITBUGS_SOURCE: /opt/gitbugs/gitbugs_full_data.csv
    SPARK_MASTER: local[2]
    SPARK_SHUFFLE_PARTITIONS: '4'
  volumes:
    - ./data:/opt/gitbugs/data
    - ./logs:/opt/airflow/logs
  depends_on:
    mysql:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: gitbugs
      MYSQL_USER: gitbugs
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16.8
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U airflow']
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow
    environment:
      <<: *environment
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
    command: ['python', '-m', 'pipeline', 'init-db']

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/health]
      interval: 15s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8974/health]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  mysql-data:
  postgres-data:
